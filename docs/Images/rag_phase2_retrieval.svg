<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="740" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="700" fill="#0f172a">Phase 2 — Retrieval: a query to ranked chunks</text>
  <text x="30" y="58" font-size="13" fill="#64748b">Reads the index Phase 1 built. Nothing here writes to Postgres.</text>

  <rect x="30" y="90" width="230" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="145" y="114" text-anchor="middle" font-weight="700">Query</text>
  <text x="145" y="132" text-anchor="middle">text · k · optional filters</text>

  <rect x="385" y="90" width="230" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="500" y="114" text-anchor="middle" font-weight="700">search_corpus(query, k)</text>
  <text x="500" y="132" text-anchor="middle">calls search_hybrid()</text>

  <line x1="260" y1="120" x2="383" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <path d="M500,150 V200 H180 V248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M500,200 H820 V248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="30" y="250" width="300" height="120" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="180" y="272" text-anchor="middle" font-weight="700" fill="#1d4ed8">DENSE channel</text>
  <text x="180" y="292" text-anchor="middle">embed query (Qwen3 "query" prompt)</text>
  <text x="180" y="310" text-anchor="middle">cosine distance · top 50</text>
  <text x="180" y="328" text-anchor="middle">optional JSONB filter: role, doc</text>
  <text x="180" y="352" text-anchor="middle" font-size="11" fill="#475569">search_with_scores()</text>

  <rect x="380" y="250" width="240" height="120" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="500" y="272" text-anchor="middle" font-weight="700">Postgres</text>
  <text x="500" y="292" text-anchor="middle">built in Phase 1</text>
  <text x="500" y="310" text-anchor="middle">vectors + BM25 index</text>
  <text x="500" y="328" text-anchor="middle">on langchain_pg_embedding</text>
  <text x="500" y="352" text-anchor="middle" font-size="11" fill="#475569">one collection per encoder × chunking</text>

  <rect x="670" y="250" width="300" height="120" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="820" y="272" text-anchor="middle" font-weight="700" fill="#b45309">SPARSE channel</text>
  <text x="820" y="292" text-anchor="middle">BM25 · rare terms, clause numbers</text>
  <text x="820" y="310" text-anchor="middle">query sanitised · top 20</text>
  <text x="820" y="328" text-anchor="middle">optional SQL filter: role, doc</text>
  <text x="820" y="352" text-anchor="middle" font-size="11" fill="#475569">search_sparse()</text>

  <line x1="380" y1="310" x2="332" y2="310" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <line x1="620" y1="310" x2="668" y2="310" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="356" y="302" text-anchor="middle" font-size="11" fill="#475569">reads</text>
  <text x="644" y="302" text-anchor="middle" font-size="11" fill="#475569">reads</text>

  <path d="M180,370 V420 H400 V468" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M820,370 V420 H600 V468" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="260" y="470" width="480" height="100" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="492" text-anchor="middle" font-weight="700" fill="#15803d">Weighted RRF — fuse()</text>
  <text x="500" y="512" text-anchor="middle">score = sum of  weight / (60 + rank)  per channel</text>
  <text x="500" y="530" text-anchor="middle">dense weight 1.0 · sparse weight 0.7</text>
  <text x="500" y="548" text-anchor="middle">union by chunk_id · ties broken on chunk_id · keep top k</text>

  <line x1="500" y1="570" x2="500" y2="618" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="260" y="620" width="480" height="70" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="500" y="644" text-anchor="middle" font-weight="700">list[Chunk]</text>
  <text x="500" y="662" text-anchor="middle">to_chunk() re-validates each row</text>
  <text x="500" y="680" text-anchor="middle">handed to Phase 3 (and later the agent)</text>

  <text x="30" y="722" font-size="12" fill="#64748b">Removed: cross-encoder rerank (artifacts/rerank.py) — lost on every metric, 124 s per query. The k=5 → k=25 retry ladder lives in Phase 3.</text>
</svg>

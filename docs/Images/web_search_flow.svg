<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 874" width="900" height="874" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="900" height="874" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Web supplement</text>
<text x="30" y="58" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">A small, bounded lookup that runs beneath a refusal.</text>
<rect x="280.0" y="84" width="340" height="54" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="450.0" y="110" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Agent refuses</text>
<text x="450.0" y="130" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">no answer from the corpus</text>
<line x1="450" y1="138" x2="450" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280.0" y="190" width="340" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="450.0" y="216" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">1  Search</text>
<text x="450.0" y="236" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">ddgs and SearXNG, merged</text>
<line x1="450" y1="252" x2="450" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280.0" y="282" width="340" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="450.0" y="308" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">2  Filter</text>
<text x="450.0" y="328" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">ads, French pages, social sites</text>
<line x1="450" y1="344" x2="450" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280.0" y="374" width="340" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="450.0" y="400" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">3  Rank</text>
<text x="450.0" y="420" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">relevance and trusted domains</text>
<line x1="450" y1="436" x2="450" y2="464" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280.0" y="466" width="340" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="450.0" y="492" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">4  Read pages</text>
<text x="450.0" y="512" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">best passages, word for word</text>
<line x1="450" y1="528" x2="450" y2="556" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280.0" y="558" width="340" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 4"/>
<text x="450.0" y="584" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">5  Summarise</text>
<text x="450.0" y="604" font-size="12" font-weight="400" fill="#166534" text-anchor="middle">plain words, one model call</text>
<rect x="636.0" y="578" width="84" height="24" rx="12" fill="#7c3aed"/>
<text x="678.0" y="595" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">OPTIONAL</text>
<line x1="450" y1="620" x2="450" y2="648" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280.0" y="650" width="340" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="450.0" y="676" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">6  Check</text>
<text x="450.0" y="696" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">numbers and sources match</text>
<line x1="450" y1="712" x2="450" y2="740" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280.0" y="742" width="340" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="450.0" y="768" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">7  Show</text>
<text x="450.0" y="788" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">boxed, numbered, labelled</text>
<path d="M280.0,497.0 H230 V773.0 H278.0" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="222" y="624.0" font-size="12" font-weight="600" fill="#475569" text-anchor="end">no summary:</text>
<text x="222" y="642.0" font-size="12" font-weight="400" fill="#475569" text-anchor="end">switch off,</text>
<text x="222" y="660.0" font-size="12" font-weight="400" fill="#475569" text-anchor="end">or check failed</text>
<rect x="30" y="834" width="18" height="18" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="56" y="848" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Plain code</text>
<rect x="170" y="834" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="196" y="848" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Model call</text>
<rect x="310" y="831" width="84" height="24" rx="12" fill="#7c3aed"/>
<text x="352.0" y="848" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">OPTIONAL</text>
</svg>

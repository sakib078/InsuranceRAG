<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" width="1000" height="1280" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="1280" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#0f172a">Phase 7 — one question, top to bottom</text>

  <!-- main column -->
  <rect x="240" y="70" width="320" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="103" text-anchor="middle" font-weight="700" fill="#5b21b6">Question arrives</text>
  <text x="400" y="121" text-anchor="middle" font-size="12" fill="#5b21b6">Orchestrator starts the run</text>

  <rect x="240" y="175" width="320" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="208" text-anchor="middle" font-weight="700" fill="#166534">Planner agent</text>
  <text x="400" y="226" text-anchor="middle" font-size="12" fill="#166534">splits into smaller questions</text>

  <rect x="240" y="280" width="320" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="313" text-anchor="middle" font-weight="700" fill="#1e3a8a">Retrieval tool</text>
  <text x="400" y="331" text-anchor="middle" font-size="12" fill="#1e3a8a">finds matching text</text>

  <rect x="240" y="385" width="320" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <text x="400" y="418" text-anchor="middle" font-weight="700" fill="#1e3a8a">Exclusion tool</text>
  <text x="400" y="436" text-anchor="middle" font-size="12" fill="#1e3a8a">looks for the limiting clause</text>

  <rect x="240" y="490" width="320" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="523" text-anchor="middle" font-weight="700" fill="#1e3a8a">Assembler</text>
  <text x="400" y="541" text-anchor="middle" font-size="12" fill="#1e3a8a">fuses the pools, fits the budget</text>

  <rect x="240" y="595" width="320" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="628" text-anchor="middle" font-weight="700" fill="#166534">Answer agent</text>
  <text x="400" y="646" text-anchor="middle" font-size="12" fill="#166534">writes the answer with sources</text>

  <rect x="240" y="700" width="320" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="733" text-anchor="middle" font-weight="700" fill="#1e3a8a">Citation verifier</text>
  <text x="400" y="751" text-anchor="middle" font-size="12" fill="#1e3a8a">checks every cited source</text>

  <rect x="240" y="805" width="320" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="838" text-anchor="middle" font-weight="700" fill="#1e3a8a">Final check</text>
  <text x="400" y="856" text-anchor="middle" font-size="12" fill="#1e3a8a">is the answer good?</text>

  <line x1="400" y1="140" x2="400" y2="173" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="245" x2="400" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="350" x2="400" y2="383" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="412" y="372" font-size="12" fill="#475569">always</text>
  <line x1="400" y1="455" x2="400" y2="488" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="560" x2="400" y2="593" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="665" x2="400" y2="698" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="770" x2="400" y2="803" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- retry loop -->
  <path d="M240,840 H150 V525 H238" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="140" y="682" text-anchor="end" font-size="13" fill="#475569">No: try</text>
  <text x="140" y="700" text-anchor="end" font-size="13" fill="#475569">once more</text>

  <!-- yes -->
  <line x1="400" y1="875" x2="400" y2="1058" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="412" y="975" font-size="13" fill="#475569">Yes</text>

  <!-- still no -->
  <path d="M560,840 H780 V933" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="830" font-size="13" fill="#475569">Still no</text>

  <rect x="640" y="935" width="280" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="780" y="965" text-anchor="middle" font-weight="700">Refuse</text>
  <text x="780" y="985" text-anchor="middle" font-size="12" fill="#475569">says it can't answer</text>

  <!-- web on / off -->
  <line x1="780" y1="1005" x2="780" y2="1058" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="792" y="1038" font-size="13" fill="#475569">Web on</text>
  <path d="M640,970 H520 V1058" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="530" y="1004" font-size="13" fill="#475569">Web off</text>

  <rect x="640" y="1060" width="280" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="780" y="1093" text-anchor="middle" font-weight="700" fill="#1e3a8a">Web supplement</text>
  <text x="780" y="1111" text-anchor="middle" font-size="12" fill="#1e3a8a">adds web links, verbatim</text>

  <rect x="240" y="1060" width="320" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="1090" text-anchor="middle" font-weight="700">Response to user</text>
  <text x="400" y="1110" text-anchor="middle" font-size="12" fill="#475569">answer with sources</text>
  <line x1="640" y1="1095" x2="562" y2="1095" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- legend -->
  <rect x="40" y="1185" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="66" y="1199" font-size="13" fill="#475569">Orchestrator</text>
  <rect x="190" y="1185" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="216" y="1199" font-size="13" fill="#475569">Agent (calls an LLM)</text>
  <rect x="400" y="1185" width="18" height="18" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="426" y="1199" font-size="13" fill="#475569">Tool (plain code)</text>
  <rect x="590" y="1185" width="18" height="18" rx="4" fill="#f8fafc" stroke="#64748b"/>
  <text x="616" y="1199" font-size="13" fill="#475569">Output</text>
  <rect x="700" y="1185" width="18" height="18" rx="4" fill="none" stroke="#64748b" stroke-dasharray="4 3"/>
  <text x="726" y="1199" font-size="13" fill="#475569">Off by default</text>
  <text x="40" y="1240" font-size="13" fill="#475569">Only the Planner and the Answer agent call an LLM. Every other node is a tool: plain code.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1200" height="990" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#0f172a">Phase 7 — layered architecture</text>

  <!-- layer containers -->
  <rect x="30" y="60" width="1140" height="110" rx="14" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="50" y="82" font-size="13" fill="#64748b">Client</text>
  <rect x="30" y="190" width="1140" height="110" rx="14" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="50" y="212" font-size="13" fill="#64748b">API layer (Phase 8)</text>
  <rect x="30" y="320" width="1140" height="130" rx="14" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="50" y="342" font-size="13" fill="#64748b">Orchestration</text>
  <rect x="30" y="470" width="1140" height="120" rx="14" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="50" y="492" font-size="13" fill="#15803d" font-weight="700">Agents — call an LLM</text>
  <rect x="30" y="610" width="1140" height="140" rx="14" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="50" y="632" font-size="13" fill="#1d4ed8" font-weight="700">Tools — plain code, no LLM</text>
  <rect x="30" y="770" width="1140" height="120" rx="14" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="50" y="792" font-size="13" fill="#64748b">Data and services</text>

  <!-- client, api -->
  <rect x="480" y="95" width="240" height="50" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="600" y="126" text-anchor="middle" font-weight="700">User / client</text>
  <rect x="460" y="225" width="280" height="56" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="600" y="247" text-anchor="middle" font-weight="700">Backend API</text>
  <text x="600" y="266" text-anchor="middle" font-size="12" fill="#475569">runs the agent graph</text>
  <line x1="600" y1="145" x2="600" y2="223" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="600" y1="281" x2="600" y2="353" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- orchestration -->
  <rect x="410" y="355" width="340" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="580" y="388" text-anchor="middle" font-weight="700" fill="#5b21b6">Orchestrator</text>
  <text x="580" y="406" text-anchor="middle" font-size="12" fill="#5b21b6">runs each node in order (LangGraph)</text>
  <rect x="840" y="355" width="260" height="76" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="970" y="388" text-anchor="middle" font-weight="700">Agent state</text>
  <text x="970" y="406" text-anchor="middle" font-size="12" fill="#475569">tracks progress and budget</text>
  <line x1="752" y1="393" x2="838" y2="393" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- guardrails -->
  <rect x="45" y="355" width="190" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="386" text-anchor="middle" font-weight="700" fill="#1e3a8a">Guardrails</text>
  <text x="140" y="405" text-anchor="middle" font-size="12" fill="#1e3a8a">checks the question in</text>
  <text x="140" y="421" text-anchor="middle" font-size="12" fill="#1e3a8a">and the answer out</text>
  <line x1="237" y1="415" x2="408" y2="415" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- answer to user -->
  <path d="M410,393 H250 V120 H478" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="258" y="262" font-size="11" fill="#7c3aed">answer to user</text>

  <!-- orchestrator to every node -->
  <line x1="585" y1="431" x2="585" y2="468" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="600" y="462" font-size="12" fill="#475569">runs every node below and reads its result back</text>

  <!-- agents -->
  <rect x="260" y="500" width="300" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="533" text-anchor="middle" font-weight="700" fill="#166534">Planner agent</text>
  <text x="410" y="551" text-anchor="middle" font-size="12" fill="#166534">splits the question</text>
  <rect x="640" y="500" width="300" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="790" y="533" text-anchor="middle" font-weight="700" fill="#166534">Answer agent</text>
  <text x="790" y="551" text-anchor="middle" font-size="12" fill="#166534">writes the cited answer</text>

  <!-- tools -->
  <rect x="45" y="645" width="170" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="678" text-anchor="middle" font-weight="700" fill="#1e3a8a">Retrieval tool</text>
  <text x="130" y="696" text-anchor="middle" font-size="12" fill="#1e3a8a">finds matching text</text>

  <rect x="233" y="645" width="170" height="76" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
  <text x="318" y="678" text-anchor="middle" font-weight="700" fill="#1e3a8a">Exclusion tool</text>
  <text x="318" y="696" text-anchor="middle" font-size="12" fill="#1e3a8a">finds the limiting clause</text>

  <rect x="421" y="645" width="170" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="506" y="678" text-anchor="middle" font-weight="700" fill="#1e3a8a">Assembler</text>
  <text x="506" y="696" text-anchor="middle" font-size="12" fill="#1e3a8a">fuses pools, fits budget</text>

  <rect x="609" y="645" width="170" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="694" y="678" text-anchor="middle" font-weight="700" fill="#1e3a8a">Citation verifier</text>
  <text x="694" y="696" text-anchor="middle" font-size="12" fill="#1e3a8a">checks cited locators</text>

  <rect x="797" y="645" width="170" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="882" y="678" text-anchor="middle" font-weight="700" fill="#1e3a8a">Final check</text>
  <text x="882" y="696" text-anchor="middle" font-size="12" fill="#1e3a8a">answer, retry or refuse</text>

  <rect x="985" y="645" width="170" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="1070" y="678" text-anchor="middle" font-weight="700" fill="#1e3a8a">Web supplement</text>
  <text x="1070" y="696" text-anchor="middle" font-size="12" fill="#1e3a8a">passages + optional summary</text>

  <!-- data -->
  <rect x="45" y="810" width="190" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="140" y="835" text-anchor="middle" font-weight="700">Chunk files</text>
  <text x="140" y="854" text-anchor="middle" font-size="12" fill="#475569">neighbouring provisions</text>
  <rect x="260" y="810" width="250" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="385" y="835" text-anchor="middle" font-weight="700">Hybrid search</text>
  <text x="385" y="854" text-anchor="middle" font-size="12" fill="#475569">dense + BM25, fused by RRF</text>
  <rect x="560" y="810" width="200" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="660" y="835" text-anchor="middle" font-weight="700">Postgres</text>
  <text x="660" y="854" text-anchor="middle" font-size="12" fill="#475569">vectors + BM25 index</text>
  <rect x="985" y="810" width="170" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="1070" y="835" text-anchor="middle" font-weight="700">Web search API</text>
  <text x="1070" y="854" text-anchor="middle" font-size="12" fill="#475569">backend not chosen</text>

  <!-- tools to data -->
  <line x1="100" y1="721" x2="100" y2="808" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M190,721 V760 H300 V808" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="395" y1="721" x2="395" y2="808" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="510" y1="840" x2="558" y2="840" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1070" y1="721" x2="1070" y2="808" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>

  <!-- legend -->
  <rect x="40" y="915" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="66" y="929" font-size="13" fill="#475569">Orchestrator</text>
  <rect x="190" y="915" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="216" y="929" font-size="13" fill="#475569">Agent (calls an LLM)</text>
  <rect x="380" y="915" width="18" height="18" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="406" y="929" font-size="13" fill="#475569">Tool (plain code)</text>
  <rect x="550" y="915" width="18" height="18" rx="4" fill="#f8fafc" stroke="#64748b"/>
  <text x="576" y="929" font-size="13" fill="#475569">Data and services</text>
  <rect x="730" y="915" width="18" height="18" rx="4" fill="none" stroke="#64748b" stroke-dasharray="4 3"/>
  <text x="756" y="929" font-size="13" fill="#475569">Off by default</text>
  <line x1="880" y1="924" x2="920" y2="924" stroke="#7c3aed" stroke-width="2"/>
  <text x="928" y="929" font-size="13" fill="#475569">Answer to user</text>
  <text x="40" y="962" font-size="13" fill="#475569">Only the Planner and the Answer agent call an LLM. Every other node is a tool, and the Exclusion tool (heavy border) always runs.</text>
</svg>

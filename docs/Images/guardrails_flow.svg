<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="900" height="720" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Guardrails</text>
<text x="30" y="58" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Two rule-based checks around the agent. No model calls.</text>
<rect x="300" y="84" width="300" height="54" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="450" y="110" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Question</text>
<text x="450" y="130" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">from the user</text>
<line x1="450" y1="138" x2="450" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="300" y="190" width="300" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="450" y="216" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">1  Guard input</text>
<text x="450" y="236" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">redact personal data</text>
<text x="450" y="254" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">stop what must not be answered</text>
<line x1="600" y1="228" x2="678" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<text x="639" y="218" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">stopped</text>
<rect x="680" y="198" width="190" height="62" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="775" y="224" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Fixed reply</text>
<text x="775" y="244" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">no model, 0 tokens</text>
<line x1="450" y1="266" x2="450" y2="316" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<text x="462" y="296" font-size="12" font-weight="600" fill="#475569" text-anchor="start">allowed</text>
<rect x="300" y="318" width="300" height="76" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="450" y="344" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">2  Agent</text>
<text x="450" y="364" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">plan, search, answer</text>
<text x="450" y="382" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">final check, retry, refuse, web</text>
<line x1="450" y1="394" x2="450" y2="444" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="300" y="446" width="300" height="92" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="450" y="472" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">3  Guard output</text>
<text x="450" y="492" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">screen the answer and summary</text>
<text x="450" y="510" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">trim a cut-off answer</text>
<text x="450" y="528" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">add the disclaimer</text>
<path d="M775,260 V492 H602" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<line x1="450" y1="538" x2="450" y2="588" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
<rect x="300" y="590" width="300" height="54" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="450" y="616" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Answer</text>
<text x="450" y="636" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">text, sources, disclaimer</text>
<rect x="30" y="680" width="18" height="18" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="56" y="694" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Guardrail code</text>
<rect x="190" y="680" width="18" height="18" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="216" y="694" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Agent graph and result</text>
</svg>

[project]
name = "insurance-rag"
version = "0.1.0"
description = "Canadian auto insurance document RAG - hybrid retrieval, reranked, evaluated"
requires-python = ">=3.11"

dependencies = [
    # retrieval
    "sentence-transformers>=3.3",
    "torch>=2.6",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5.20",
    # document parsing
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    # generation
    "anthropic>=0.69",
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # misc
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2.9",
    "datasets>=3.0",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insurance_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: golden-set retrieval regression test; fails CI if quality drops",
    "slow: requires model download",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]